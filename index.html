<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЄДКІ тести</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2024;--muted:#5b6470;--line:#d3d9e0;--accent:#2457d6;--accent-text:#fff;
--ok:#14733a;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--text:#e8ebef;--muted:#9aa4b0;--line:#323943;
--accent:#7aa2ff;--accent-text:#10151c;--ok:#6fd49a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1c1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 4px}
h2{font-size:1.15rem;line-height:1.4;margin:0 0 14px}
h3{font-size:1.05rem;margin:22px 0 8px}
.muted{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.topic{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.topic:hover:not(:disabled){border-color:var(--accent)}
.topic:disabled{opacity:.5;cursor:default}
.subj{margin:22px 0 8px;font-size:1.05rem}
.topic.all{font-weight:600}
.topic .n{color:var(--muted);white-space:nowrap}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .2s}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{min-width:1.4em;color:var(--muted);font-weight:600}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{min-height:1.6em;margin:10px 0;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.wrong{border-top:1px solid var(--line);padding:10px 0}
.wrong .you{color:var(--bad)}.wrong .right{color:var(--ok)}
.big{font-size:2rem;font-weight:700;margin:4px 0}
.col{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.jump{width:5.5em;font:inherit;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.code{font:inherit;font-size:1.1rem;letter-spacing:.08em;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
background:var(--card);color:var(--text);width:12em;max-width:100%;text-transform:uppercase}
label{font-weight:600}
a.back,button.back{color:var(--accent);background:none;border:0;padding:6px 0;font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

const DASH = /^[\s\-–—−]+$/;
const app = document.getElementById("app");
const cfg = {limit: 0, shuffleQ: false, shuffleO: false, reveal: false};
let S = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const LET = "ABCDE";
// keep only questions with a known correct answer; hide "—" placeholder options; remember the original letters
function prepare(items) {
  return items.filter(x => x.a && x.o.indexOf(x.a) >= 0).map(x => ({
    q: x.q, a: x.a,
    o: x.o.map((t, i) => ({t: t, L: LET[i]})).filter(p => p.t === x.a || !DASH.test(p.t))
  }));
}
let TOPICS = [];
function build() { TOPICS = DATA.map(t => ({s: t.s || "", t: t.t, items: prepare(t.q), all: t.q.length})); }

const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
function saved(v) {
  try {
    if (v === undefined) return localStorage.getItem("quiz_code") || "";
    if (v) localStorage.setItem("quiz_code", v); else localStorage.removeItem("quiz_code");
  } catch (e) {}
  return "";
}
async function unlock(code) {
  const norm = code.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!norm) return false;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  for (const slot of ENC.slots) {
    let raw;
    try { raw = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(slot.iv)}, kek, b64(slot.ct)); }
    catch (e) { continue; }
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv)}, key, b64(ENC.ct));
    DATA = JSON.parse(new TextDecoder().decode(plain));
    return true;
  }
  return false;
}
function login(msg) {
  S = null;
  document.title = TITLE;
  app.replaceChildren();
  app.append(el("h1", "", TITLE));
  const card = el("div", "card");
  const lab = el("label", "", "Код доступу");
  lab.htmlFor = "code";
  const inp = el("input", "code");
  inp.id = "code"; inp.type = "text"; inp.autocomplete = "off"; inp.autocapitalize = "characters"; inp.spellcheck = false;
  inp.placeholder = "XXXX-XXXX";
  const go = el("button", "btn", "Увійти");
  const fb = el("div", "fb bad", msg || "");
  const row = el("div", "row");
  row.append(inp, go);
  card.append(lab, row, fb);
  app.append(card);
  if (!window.crypto || !crypto.subtle) {
    fb.textContent = "Цей браузер не підтримує розшифрування. Відкрий сторінку за адресою https:// в сучасному браузері.";
    go.disabled = true;
    return;
  }
  const submit = async () => {
    go.disabled = true; fb.className = "fb"; fb.textContent = "Перевіряю…";
    let ok = false;
    try { ok = await unlock(inp.value); } catch (e) { ok = false; }
    if (ok) { saved(inp.value); build(); home(); }
    else { go.disabled = false; fb.className = "fb bad"; fb.textContent = "Код не підходить. Перевір, чи введено без помилок."; inp.focus(); }
  };
  go.onclick = submit;
  inp.onkeydown = e => { if (e.key === "Enter") submit(); };
  inp.focus();
}
async function boot() {
  if (!ENC) { build(); home(); return; }
  const code = saved();
  let ok = false;
  if (code && window.crypto && crypto.subtle) { try { ok = await unlock(code); } catch (e) { ok = false; } }
  if (ok) { build(); home(); }
  else { if (code) saved(null); login(code ? "Збережений код більше не діє. Введи чинний код." : ""); }
}

function check(parent, text, key) {
  const l = el("label", "");
  const c = el("input"); c.type = "checkbox"; c.checked = cfg[key];
  c.onchange = () => { cfg[key] = c.checked; };
  l.append(c, document.createTextNode(" " + text));
  parent.append(l);
}

function home() {
  S = null;
  document.title = TITLE;
  app.replaceChildren();
  app.append(el("h1", "", TITLE));
  const total = TOPICS.reduce((n, t) => n + t.items.length, 0);
  app.append(el("div", "muted", "Обери тему. Після кожної відповіді одразу видно, правильно чи ні. Усього питань: " + total));

  const opts = el("div", "card");
  const row1 = el("div", "row");
  const lab = el("label", "", "Скільки питань: ");
  const sel = el("select");
  [["0", "усі"], ["10", "10"], ["20", "20"], ["50", "50"]].forEach(([v, t]) => {
    const o = el("option", "", t); o.value = v; if (+v === cfg.limit) o.selected = true; sel.append(o);
  });
  sel.onchange = () => { cfg.limit = +sel.value; };
  lab.append(sel);
  row1.append(lab);
  const col = el("div", "col");
  check(col, "перемішувати питання", "shuffleQ");
  check(col, "перемішувати варіанти відповідей", "shuffleO");
  check(col, "режим перегляду: правильна відповідь видна одразу", "reveal");
  opts.append(row1, col);
  app.append(opts);

  const allBtn = el("button", "topic");
  allBtn.append(el("span", "", "Усі теми разом"), el("span", "n", total + " пит."));
  allBtn.disabled = total === 0;
  allBtn.onclick = () => start([].concat(...TOPICS.map(t => t.items)));
  app.append(allBtn);
  let curSubj = null;
  if (ENC) {
    const out = el("button", "back", "Вийти (забути код на цьому пристрої)");
    out.onclick = () => { saved(null); DATA = null; TOPICS = []; login(); };
    app.append(out);
  }
  TOPICS.forEach(t => {
    if (t.s !== curSubj) {
      curSubj = t.s;
      const mine = TOPICS.filter(x => x.s === curSubj);
      if (curSubj && !(mine.length === 1 && mine[0].t === curSubj)) {
        const n = mine.reduce((k, x) => k + x.items.length, 0);
        app.append(el("h2", "subj", curSubj));
        const sb = el("button", "topic all");
        sb.append(el("span", "", "Весь предмет"), el("span", "n", n + " пит."));
        sb.disabled = n === 0;
        sb.onclick = () => start([].concat(...mine.map(x => x.items)));
        app.append(sb);
      }
    }
    const b = el("button", "topic");
    b.append(el("span", "", t.t), el("span", "n", t.items.length + " пит."));
    b.disabled = t.items.length === 0;
    b.onclick = () => start(t.items);
    app.append(b);
  });
}

function start(items, noReveal) {
  let list = cfg.shuffleQ ? shuffle(items) : items.slice();
  if (cfg.limit > 0) list = list.slice(0, cfg.limit);
  S = {list: list, i: 0, ok: 0, bad: [], answered: false, opts: [], view: "quiz", reveal: cfg.reveal && !noReveal};
  quiz();
}

function quiz() {
  const it = S.list[S.i], N = S.list.length;
  S.answered = false;
  S.tries = 0;
  S.opts = cfg.shuffleO ? shuffle(it.o) : it.o.slice();
  app.replaceChildren();
  const back = el("button", "back", "← до списку тем");
  back.onclick = home;
  app.append(back);
  const bar = el("div", "bar");
  bar.append(el("span", "", "Питання " + (S.i + 1) + " з " + N));
  if (S.reveal) {
    const jl = el("label", "", "перейти до № ");
    const j = el("input", "jump"); j.type = "number"; j.min = 1; j.max = N; j.value = S.i + 1;
    j.onchange = () => { const v = Math.min(Math.max(parseInt(j.value, 10) || 1, 1), N); S.i = v - 1; quiz(); };
    jl.append(j);
    bar.append(jl);
  } else {
    bar.append(el("span", "", "✔ " + S.ok + "   ✘ " + S.bad.length));
  }
  app.append(bar);
  const track = el("div", "track"), fill = el("div", "fill");
  fill.style.width = (S.i / N * 100) + "%";
  track.append(fill);
  app.append(track);

  const card = el("div", "card");
  card.append(el("h2", "", it.q));
  const btns = S.opts.map((p, idx) => {
    const b = el("button", "opt");
    b.append(el("span", "k", (cfg.shuffleO ? String(idx + 1) : p.L) + "."), el("span", "", p.t));
    b.onclick = () => answer(idx);
    card.append(b);
    return b;
  });
  const fb = el("div", "fb");
  fb.setAttribute("aria-live", "polite");
  const nav = el("div", "row");
  const prev = el("button", "btn ghost", "← Назад");
  prev.onclick = prevQ;
  prev.style.display = S.reveal && S.i > 0 ? "" : "none";
  const next = el("button", "btn", S.i + 1 < N ? "Далі" : (S.reveal ? "До списку тем" : "Показати результат"));
  next.style.display = "none";
  next.onclick = nextQ;
  const show = el("button", "btn ghost", "Показати правильну відповідь");
  show.style.display = "none";
  show.onclick = showAnswer;
  nav.append(prev, show, next);
  card.append(fb, nav);
  app.append(card);
  S.ui = {btns, fb, next, show, fill};
  if (S.reveal) {
    S.answered = true;
    btns.forEach((b, k) => {
      b.disabled = true;
      if (S.opts[k].t === it.a) { b.classList.add("ok"); b.firstChild.textContent = "✓"; }
      else b.classList.add("dim");
    });
    fb.className = "fb ok";
    fb.textContent = "Правильна відповідь виділена зеленим.";
    next.style.display = "";
  }
}

function lock(it) {
  S.answered = true;
  S.ui.btns.forEach((b, k) => {
    b.disabled = true;
    if (S.opts[k].t === it.a) { b.classList.add("ok"); b.firstChild.textContent = "✓"; }
    else if (!b.classList.contains("bad")) b.classList.add("dim");
  });
  S.ui.show.style.display = "none";
  S.ui.next.style.display = "";
  S.ui.next.focus();
}
// a wrong choice is marked and the question stays open: pick another option (only the first try counts)
function answer(idx) {
  if (!S || S.view !== "quiz" || S.answered) return;
  const it = S.list[S.i], b = S.ui.btns[idx];
  if (b.disabled) return;
  const chosen = S.opts[idx].t;
  if (chosen === it.a) {
    if (S.tries === 0) S.ok++;
    S.ui.fb.className = "fb ok";
    S.ui.fb.textContent = S.tries === 0 ? "Правильно!" : "Правильно (не з першої спроби).";
    lock(it);
  } else {
    if (S.tries === 0) S.bad.push({it: it, chosen: chosen});
    S.tries++;
    b.disabled = true; b.classList.add("bad"); b.firstChild.textContent = "✗";
    S.ui.fb.className = "fb bad";
    S.ui.fb.textContent = "Неправильно. Спробуй інший варіант.";
    S.ui.show.style.display = "";
  }
}
function showAnswer() {
  if (!S || S.answered) return;
  S.ui.fb.className = "fb";
  S.ui.fb.textContent = "Правильна відповідь виділена зеленим.";
  lock(S.list[S.i]);
}

function nextQ() {
  if (!S || !S.answered) return;
  if (S.reveal) { if (S.i + 1 < S.list.length) { S.i++; quiz(); } else home(); return; }
  S.i++;
  if (S.i < S.list.length) quiz(); else result();
}
function prevQ() {
  if (S && S.reveal && S.i > 0) { S.i--; quiz(); }
}

function result() {
  S.view = "result";
  app.replaceChildren();
  const n = S.list.length, pct = Math.round(S.ok / n * 100);
  const card = el("div", "card");
  card.append(el("div", "muted", "Результат"), el("div", "big", S.ok + " з " + n + " (" + pct + "%)"));
  const row = el("div", "row");
  if (S.bad.length) {
    const r = el("button", "btn", "Повторити помилки (" + S.bad.length + ")");
    r.onclick = () => { const items = S.bad.map(b => b.it); const keep = cfg.limit; cfg.limit = 0; start(items, true); cfg.limit = keep; };
    row.append(r);
  }
  const h = el("button", "btn ghost", "На початок");
  h.onclick = home;
  row.append(h);
  card.append(row);
  app.append(card);
  if (S.bad.length) {
    app.append(el("h3", "", "Помилки"));
    S.bad.forEach(b => {
      const d = el("div", "wrong");
      d.append(el("div", "", b.it.q), el("div", "you", "✗ Ваша відповідь: " + b.chosen), el("div", "right", "✓ Правильно: " + b.it.a));
      app.append(d);
    });
  }
}

document.addEventListener("keydown", e => {
  if (!S || S.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (/^[1-9]$/.test(e.key)) { if (!S.reveal) answer(+e.key - 1); }
  else if (e.key === "ArrowLeft") prevQ();
  else if ((e.key === "Enter" || e.key === "ArrowRight") && S.answered) { e.preventDefault(); nextQ(); }
});
boot();
</script>
