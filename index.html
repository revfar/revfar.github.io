<html lang="uk">
<head>
<meta charset="utf-8">

<title>ЄДКІ: терапевтичний профіль</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2024;--muted:#5b6470;--line:#d3d9e0;--accent:#2457d6;--accent-text:#fff;
--ok:#14733a;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--text:#e8ebef;--muted:#9aa4b0;--line:#323943;
--accent:#7aa2ff;--accent-text:#10151c;--ok:#6fd49a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1c1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 4px}
h2{font-size:1.15rem;line-height:1.4;margin:0 0 14px}
h3{font-size:1.05rem;margin:22px 0 8px}
.muted{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.topic{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.topic:hover:not(:disabled){border-color:var(--accent)}
.topic:disabled{opacity:.5;cursor:default}
.topic .n{color:var(--muted);white-space:nowrap}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .2s}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{min-width:1.4em;color:var(--muted);font-weight:600}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{min-height:1.6em;margin:10px 0;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.wrong{border-top:1px solid var(--line);padding:10px 0}
.wrong .you{color:var(--bad)}.wrong .right{color:var(--ok)}
.big{font-size:2rem;font-weight:700;margin:4px 0}
.col{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.jump{width:5.5em;font:inherit;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
a.back{color:var(--accent);background:none;border:0;padding:6px 0;font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

ра з льодом до місця травми"}, {"q": "Під час догляду та для допомоги пацієнту, у якого триває друга стадія гарячки (температура тіла — 39°С), сестра медична застосувала охолоджувальний компрес на лоб. Як часто його необхідно змінювати?", "o": ["Раз на добу", "Кожні 2-3 хв", "Через 1 год", "За вимогою", "Кожні 30 хв"], "a": "Кожні 2-3 хв"}, {"q": "У пацієнта, який хворіє на рак легень, раптово, під час кашлю розпочалося виділення пінистої яскраво-червоної крові з рота. Які заходи долікарської допомоги доцільно розпочати негайно?", "o": ["Провести сліпе зондування", "Дати вдихнути пари нашатирного спирту", "Промити шлунок", "Застосувати помірне охолодження грудної клітки", "Прикласти грілку на грудну клітку"], "a": "Застосувати помірне охолодження грудної клітки"}, {"q": "Укажіть оптимальну температуру води для проведення очисної клізми пацієнту з атонічним закрепом.", "o": ["37-38°C", "18-20°С", "38-40°С", "25-30°С", "28-32°С"], "a": "18-20°С"}, {"q": "П’ятирічна дитина каталася на самокаті і впала. На місці забою виникла гематома без пошкодження шкірних покривів. Які дії зменшать зону крововиливу?", "o": ["Застосування гірчичників", "Прикладання медичної грілки", "Застосування міхура з льодом", "Накладання зігрівального компресу", "–"], "a": "Застосування міхура з льодом"}, {"q": "Пацієнту в першу добу після травми показане прикладання міхура з льодом до місця ушкодження. Оберіть правильний режим його застосування, щоб уникнути місцевого переохолодження.", "o": ["Кожні 40 хв робити перерву на 10-15 хв", "Кожні 5 хв робити перерву на 20-30 хв", "Кожні 20 хв робити перерву на 10-15 хв", "—", "Кожні 60 хв робити перерву на 20-30 хв"], "a": "Кожні 20 хв робити перерву на 10-15 хв"}, {"q": "Пацієнт перебуває на лікуванні в хірургічному відділенні після дорожньотранспортної пригоди, яка сталася 2 дні тому. У ділянці стегна, в місці забою, утворилася гематома. Укажіть оптимальну лікувальну тактику, що сприятиме розсмоктуванню гематоми.", "o": ["Прикладання міхура з льодом", "Накладання охолоджувального компресу", "Накладання зігрівального компресу", "Застосування гірчичників", "Іммобілізація кінцівки"], "a": "Накладання зігрівального компресу"}, {"q": "Пацієнту терапевтичного відділення з діагностичною метою проводять дуоденальне зондування. На етапі отримання жовчі порції В йому прикладають медичну грілку під праве підребер’я. Яка основна мета її застосування в цьому разі?", "o": ["Розширення жовчних протоків для покращення відтоку жовчі", "Зігрівання пацієнта для покращення загального стану", "Зменшення продукції шлункового соку для зниження кислотності", "Звуження кровоносних судин для запобігання кровотечі", "Зменшення чутливості в ділянці правого підребер’я"], "a": "Розширення жовчних протоків для покращення відтоку жовчі"}, {"q": "Для зменшення інтенсивності спастичного болю, що супроводжує перебіг хронічного холециститу, пацієнту рекомендовано використання медичної грілки. Якою має бути температура води для заповнення грілки в цьому разі?", "o": ["50°С", "80°С", "40°С", "60°С", "90°С"], "a": "60°С"}, {"q": "Пацієнт, у якого триває І стадія гарячки, скаржиться на головний біль, м’язове тремтіння, мерзлякуватість, біль у м’язах, загальне нездужання. Об’єктивно спостерігається: шкіра бліда, холодна на дотик, набула вигляду «гусячої». Який найпростіший метод фізіотерапії доцільно застосовувати в І стадії гарячки для полегшення стану пацієнта?", "o": ["Застосування гірчичників", "Застосування медичної грілки", "Прикладання міхура з льодом", "Накладання охолоджувального компресу", "Прикладання мішечків із сухим льодом на ділянку великих судин шиї"], "a": "Застосування медичної грілки"}, {"q": "Вкажіть тривалість прийому родонової ванни.", "o": ["30-40 хв", "50-60 хв", "1-2 хв", "5-7 хв", "10-15 хв"], "a": "10-15 хв"}, {"q": "Пацієнту з діагнозом: гострий панкреатит — призначено щадний режим для підшлункової залози (спокій, голод і найпростіші фізіотерапевтичні процедури на епігастральну ділянку, що зменшують біль). Який фізичний чинник буде найбільш ефективним для зменшення больових відчуттів?", "o": ["Холод", "Вентиляція", "Вібрація", "Тепло", "Опромінювання"], "a": "Холод"}, {"q": "Пацієнту, у якого спостерігаються симптоми загострення хронічного панкреатиту, на живіт прикладено міхур із льодом. Укажіть механізм дії холодових процедур на нервові закінчення.", "o": ["Зменшення збудливості нервових волокон", "Блокада проведення нервових імпульсів", "Стимуляція вироблення ендорфінів", "Збільшення швидкості проведення нервових імпульсів", "Стимуляція регенерації нервових клітин"], "a": "Зменшення збудливості нервових волокон"}, {"q": "Пацієнту призначено фізіотерапевтичну процедуру, під час якої (внаслідок змінений проникності судинної стінки) у шкірі виникають точкові мікрокрововиливи (петехїї, плями), до складу яких входять біологічно активні речовини, що спричиняють потужний стимулювальний ефект як на весь організм, так і на певну зону до повного їх розсмоктування. Яку процедуру призначено пацієнту?", "o": ["Вакуум-терапію медичними банками", "Накладання гірчичників", "Застосування медичної грілки", "УВЧ-терапію", "Накладання зігрівального компресу"], "a": "Вакуум-терапію медичними банками"}, {"q": "Сестра медична неврологічного відділення складає план догляду за пацієнтом із перенесеним в анамнезі інсультом, у якого спостерігається підвищення температури тіла. Який із нижченаведених факторів є відносним протипоказанням для застосування холодових процедур?", "o": ["Порушення чутливості шкіри", "Тахікардія", "Вивихи та розтягнення", "Алергічні реакції", "Варикозне розширення вен"], "a": "Порушення чутливості шкіри"}, {"q": "У пацієнта, який хворіє на пневмонію, спостерігається періодичне підвищення температури тіла до високих цифр. Наразі у нього з'явилися симптоми, що характерні для першої стадії гарячки: блідість шкіри, озноб, головний біль, загальна слабкість та нездужання, тягнучий біль у м'язах, прискорене серцебиття, спрага. Яких заходів доцільно вжити для полегшення симптомів у цьому разі?", "o": ["Обкласти пацієнта теплими грілками", "Підняти ножний кінець ліжка на 30-40 см", "Застосувати загальний контрастний душ", "Застосувати холодні компреси на лоб, підпахвові та підколінні ділянки", "Обмежити вживання рідини"], "a": "Обкласти пацієнта теплими грілками"}, {"q": "Чоловік віком 22 роки отримав забій лівого гомілковостопного суглоба під час гри у футбол. У ділянці травми спостерігаються набряк, гіперемія та локальна болючість. Яку фізіотерапевтичну процедуру доцільно застосувати в перші години після ушкодження для полегшення симптомів?", "o": ["Холод до місця травми", "Зігрівальний компрес на травмований суглоб", "Гарячі ножні ванни", "Масаж травмованої ділянки", "Парафінові аплікації на травмований суглоб"], "a": "Холод до місця травми"}, {"q": "Як називається метод лікування пацієнтів із викорстанням медичних п’явок?", "o": ["Іеліотерапія", "Спеліотерапія", "Оксигенотерапія", "Гідротерапія", "Гірудотерапія"], "a": "Гірудотерапія"}]}, {"t": "ВИПИСУВАННЯ,ЗБЕРІГАННЯ, ЗАСТОСУВАННЯ ЛІКАРСЬКИХ ЗАСОБІВ", "q": [{"q": "Як називається індивідуальна упаковка, що безпосередньо контактує з лікарським засобом та сприяє збереженню його основних властивостей?", "o": ["Спеціальна", "Первинна", "Зовнішня", "Вторинна", "Загальна"], "a": "Первинна"}, {"q": "Які лікарські засоби відносяться до списку «Б»?", "o": ["Імунобіологічні", "Сильнодіючі", "Психотропні", "Отруйні", "Наркотичні"], "a": "Сильнодіючі"}, {"q": "З якою метою флакон із вушними краплями перед застосуванням треба підігріти у руках до температури тіла людини?", "o": ["Для попередження виникнення кашлю", "Для підсилення лікувального ефекту", "Для попередження підвищення температури тіла", "Для уникнення запаморочення", "Для кращої взаємодії з назальними краплями"], "a": "Для уникнення запаморочення"}, {"q": "Як називається доза лікарського засобу, що призначається на один прийом?", "o": ["Мінімальна", "Разова", "Добова", "Токсична", "Максимальна"], "a": "Разова"}, {"q": "Які лікарські засоби найчаст івої верхньої кінцівки, погіршення мовлення та зору. Симптоми зберігаються понад 24 год. В анамнезі: ішемічна хвороба серця, перенесений інфаркт міокарда. Для якого порушення мозкового кровообігу характерні ці клінічні прояви?", "o": ["Геморагічного інсульту", "–", "Ішемічного інсульту", "Транзиторної ішемічної атаки", "Дисциркуляторної енцефалопатії"], "a": "Ішемічного інсульту"}, {"q": "Пацієнт віком 48 років скаржиться на слабкість та відчуття оніміння у нижніх кінцівках, біль у спині, порушення сечовиділення та затримку випорожнень. Скарги з’явилися після перенесеного грипу. Об’єктивно спостерігається: зниження поверхневої чутливості, гіпотонія та гіпотрофія м’язів нижніх кінцівок. Для якого захворювання характерні вказані клінічні прояви?", "o": ["Пухлини спинного мозку", "Розсіяного склерозу", "Мієліту", "Поліомієліту", "Спінального інсульту"], "a": "Мієліту"}, {"q": "Укажіть ранній і характерний симптом ураження мозкових оболонок.", "o": ["Ортнера", "Падалки", "Грефе", "Керніга", "Пастернацького"], "a": "Керніга"}, {"q": "У якому положенні має перебувати пацієнт протягом перших 2-х год після проведення люмбальної пункції?", "o": ["Позиції Тренделенбурга", "Лежачи на спині", "Позиції Фаулера", "Позиції Сімса", "Лежачи на животі"], "a": "Лежачи на животі"}, {"q": "У дванадцятирічного пацієнта попередній діагноз: епілепсія. Який метод обстеження потрібно використати для графічної реєстрації біоелектричної активності головного мозку та підтвердження діагнозу?", "o": ["Ультразвукове дослідження головного мозку", "Магнітно-резонансна томографія головного мозку", "Електрокардіографія", "Комп'ютерна томографія головного мозку", "Електроенцефалографія"], "a": "Електроенцефалографія"}, {"q": "У пацієнтки, в якої розвинулося гостре порушення мозкового кровообігу, спостерігається відсутність рухів у лівих кінцівках із гіпертонусом м’язів та гіперрефлексією, визначається симптом Бабінського. Який вид рухового порушення спостерігається в пацієнтки?", "o": ["Центральний пар const LET = "ABCDE";
// keep only questions with a known correct answer; hide "—" placeholder options; remember the original letters
function prepare(items) {
  return items.filter(x => x.a && x.o.indexOf(x.a) >= 0).map(x => ({
    q: x.q, a: x.a,
    o: x.o.map((t, i) => ({t: t, L: LET[i]})).filter(p => p.t === x.a || !DASH.test(p.t))
  }));
}
const TOPICS = DATA.map(t => ({t: t.t, items: prepare(t.q), all: t.q.length}));

function check(parent, text, key) {
  const l = el("label", "");
  const c = el("input"); c.type = "checkbox"; c.checked = cfg[key];
  c.onchange = () => { cfg[key] = c.checked; };
  l.append(c, document.createTextNode(" " + text));
  parent.append(l);
}

function home() {
  S = null;
  document.title = TITLE;
  app.replaceChildren();
  app.append(el("h1", "", TITLE));
  const total = TOPICS.reduce((n, t) => n + t.items.length, 0);
  app.append(el("div", "muted", "Обери тему. Після кожної відповіді одразу видно, правильно чи ні. Усього питань: " + total));

  const opts = el("div", "card");
  const row1 = el("div", "row");
  const lab = el("label", "", "Скільки питань: ");
  const sel = el("select");
  [["0", "усі"], ["10", "10"], ["20", "20"], ["50", "50"]].forEach(([v, t]) => {
    const o = el("option", "", t); o.value = v; if (+v === cfg.limit) o.selected = true; sel.append(o);
  });
  sel.onchange = () => { cfg.limit = +sel.value; };
  lab.append(sel);
  row1.append(lab);
  const col = el("div", "col");
  check(col, "перемішувати питання", "shuffleQ");
  check(col, "перемішувати варіанти відповідей", "shuffleO");
  check(col, "режим перегляду: правильна відповідь видна одразу", "reveal");
  opts.append(row1, col);
  app.append(opts);

  const allBtn = el("button", "topic");
  allBtn.append(el("span", "", "Усі теми разом"), el("span", "n", total + " пит."));
  allBtn.disabled = total === 0;
  allBtn.onclick = () => start([].concat(...TOPICS.map(t => t.items)));
  app.append(allBtn);
  TOPICS.forEach(t => {
    const b = el("button", "topic");
    b.append(el("span", "", t.t), el("span", "n", t.items.length + " пит."));
    b.disabled = t.items.length === 0;
    b.onclick = () => start(t.items);
    app.append(b);
  });
}

function start(items, noReveal) {
  let list = cfg.shuffleQ ? shuffle(items) : items.slice();
  if (cfg.limit > 0) list = list.slice(0, cfg.limit);
  S = {list: list, i: 0, ok: 0, bad: [], answered: false, opts: [], view: "quiz", reveal: cfg.reveal && !noReveal};
  quiz();
}

function quiz() {
  const it = S.list[S.i], N = S.list.length;
  S.answered = false;
  S.tries = 0;
  S.opts = cfg.shuffleO ? shuffle(it.o) : it.o.slice();
  app.replaceChildren();
  const back = el("button", "back", "← до списку тем");
  back.onclick = home;
  app.append(back);
  const bar = el("div", "bar");
  bar.append(el("span", "", "Питання " + (S.i + 1) + " з " + N));
  if (S.reveal) {
    const jl = el("label", "", "перейти до № ");
    const j = el("input", "jump"); j.type = "number"; j.min = 1; j.max = N; j.value = S.i + 1;
    j.onchange = () => { const v = Math.min(Math.max(parseInt(j.value, 10) || 1, 1), N); S.i = v - 1; quiz(); };
    jl.append(j);
    bar.append(jl);
  } else {
    bar.append(el("span", "", "✔ " + S.ok + "   ✘ " + S.bad.length));
  }
  app.append(bar);
  const track = el("div", "track"), fill = el("div", "fill");
  fill.style.width = (S.i / N * 100) + "%";
  track.append(fill);
  app.append(track);

  const card = el("div", "card");
  card.append(el("h2", "", it.q));
  const btns = S.opts.map((p, idx) => {
    const b = el("button", "opt");
    b.append(el("span", "k", (cfg.shuffleO ? String(idx + 1) : p.L) + "."), el("span", "", p.t));
    b.onclick = () => answer(idx);
    card.append(b);
    return b;
  });
  const fb = el("div", "fb");
  fb.setAttribute("aria-live", "polite");
  const nav = el("div", "row");
  const prev = el("button", "btn ghost", "← Назад");
  prev.onclick = prevQ;
  prev.style.display = S.reveal && S.i > 0 ? "" : "none";
  const next = el("button", "btn", S.i + 1 < N ? "Далі" : (S.reveal ? "До списку тем" : "Показати результат"));
  next.style.display = "none";
  next.onclick = nextQ;
  const show = el("button", "btn ghost", "Показати правильну відповідь");
  show.style.display = "none";
  show.onclick = showAnswer;
  nav.append(prev, show, next);
  card.append(fb, nav);
  app.append(card);
  S.ui = {btns, fb, next, show, fill};
  if (S.reveal) {
    S.answered = true;
    btns.forEach((b, k) => {
      b.disabled = true;
      if (S.opts[k].t === it.a) { b.classList.add("ok"); b.firstChild.textContent = "✓"; }
      else b.classList.add("dim");
    });
    fb.className = "fb ok";
    fb.textContent = "Правильна відповідь виділена зеленим.";
    next.style.display = "";
  }
}

function lock(it) {
  S.answered = true;
  S.ui.btns.forEach((b, k) => {
    b.disabled = true;
    if (S.opts[k].t === it.a) { b.classList.add("ok"); b.firstChild.textContent = "✓"; }
    else if (!b.classList.contains("bad")) b.classList.add("dim");
  });
  S.ui.show.style.display = "none";
  S.ui.next.style.display = "";
  S.ui.next.focus();
}
// a wrong choice is marked and the question stays open: pick another option (only the first try counts)
function answer(idx) {
  if (!S || S.view !== "quiz" || S.answered) return;
  const it = S.list[S.i], b = S.ui.btns[idx];
  if (b.disabled) return;
  const chosen = S.opts[idx].t;
  if (chosen === it.a) {
    if (S.tries === 0) S.ok++;
    S.ui.fb.className = "fb ok";
    S.ui.fb.textContent = S.tries === 0 ? "Правильно!" : "Правильно (не з першої спроби).";
    lock(it);
  } else {
    if (S.tries === 0) S.bad.push({it: it, chosen: chosen});
    S.tries++;
    b.disabled = true; b.classList.add("bad"); b.firstChild.textContent = "✗";
    S.ui.fb.className = "fb bad";
    S.ui.fb.textContent = "Неправильно. Спробуй інший варіант.";
    S.ui.show.style.display = "";
  }
}
function showAnswer() {
  if (!S || S.answered) return;
  S.ui.fb.className = "fb";
  S.ui.fb.textContent = "Правильна відповідь виділена зеленим.";
  lock(S.list[S.i]);
}

function nextQ() {
  if (!S || !S.answered) return;
  if (S.reveal) { if (S.i + 1 < S.list.length) { S.i++; quiz(); } else home(); return; }
  S.i++;
  if (S.i < S.list.length) quiz(); else result();
}
function prevQ() {
  if (S && S.reveal && S.i > 0) { S.i--; quiz(); }
}

function result() {
  S.view = "result";
  app.replaceChildren();
  const n = S.list.length, pct = Math.round(S.ok / n * 100);
  const card = el("div", "card");
  card.append(el("div", "muted", "Результат"), el("div", "big", S.ok + " з " + n + " (" + pct + "%)"));
  const row = el("div", "row");
  if (S.bad.length) {
    const r = el("button", "btn", "Повторити помилки (" + S.bad.length + ")");
    r.onclick = () => { const items = S.bad.map(b => b.it); const keep = cfg.limit; cfg.limit = 0; start(items, true); cfg.limit = keep; };
    row.append(r);
  }
  const h = el("button", "btn ghost", "На початок");
  h.onclick = home;
  row.append(h);
  card.append(row);
  app.append(card);
  if (S.bad.length) {
    app.append(el("h3", "", "Помилки"));
    S.bad.forEach(b => {
      const d = el("div", "wrong");
      d.append(el("div", "", b.it.q), el("div", "you", "✗ Ваша відповідь: " + b.chosen), el("div", "right", "✓ Правильно: " + b.it.a));
      app.append(d);
    });
  }
}

document.addEventListener("keydown", e => {
  if (!S || S.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (/^[1-9]$/.test(e.key)) { if (!S.reveal) answer(+e.key - 1); }
  else if (e.key === "ArrowLeft") prevQ();
  else if ((e.key === "Enter" || e.key === "ArrowRight") && S.answered) { e.preventDefault(); nextQ(); }
});
home();
</script>
</body>
</html>
