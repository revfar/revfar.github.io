<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЄДКІ тести</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2024;--muted:#5b6470;--line:#d3d9e0;--accent:#2457d6;--accent-text:#fff;
--ok:#14733a;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--text:#e8ebef;--muted:#9aa4b0;--line:#323943;
--accent:#7aa2ff;--accent-text:#10151c;--ok:#6fd49a;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1c1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.4rem;margin:8px 0 4px}
h2{font-size:1.15rem;line-height:1.4;margin:0 0 14px}
h3{font-size:1.05rem;margin:22px 0 8px}
.muted{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.topic{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.topic:hover:not(:disabled){border-color:var(--accent)}
.topic:disabled{opacity:.5;cursor:default}
.subj{margin:22px 0 8px;font-size:1.05rem}
.topic.all{font-weight:600}
.topic .n{color:var(--muted);white-space:nowrap}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:10px 0}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bar{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--muted)}
.track{height:6px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .2s}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{min-width:1.4em;color:var(--muted);font-weight:600}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{min-height:1.6em;margin:10px 0;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.wrong{border-top:1px solid var(--line);padding:10px 0}
.wrong .you{color:var(--bad)}.wrong .right{color:var(--ok)}
.big{font-size:2rem;font-weight:700;margin:4px 0}
.col{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.jump{width:5.5em;font:inherit;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
a.back{color:var(--accent);background:none;border:0;padding:6px 0;font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

и рук перед виконанням внутрішньовенної ін’єкції?", "o": ["6 мл", "9 мл", "5 мл", "1 мл", "3 мл"], "a": "3 мл"}, {"q": "Для проведення проби якості передстерилізаційного очищення медичного інструментарію сестра медична приготувала робочий розчин азопіраму, змішавши в рівних об’ємах початковий розчин азопіраму з 3%-м розчином перекису водню. Укажіть термін зберігання робочого реактиву.", "o": ["6 год", "2 год", "3 год", "1 добу", "1 місяць"], "a": "2 год"}, {"q": "У якій зоні централізованого стерилізаційного відділення проводиться комплектація, пакування та стерилізація медичних виробів?", "o": ["Режимній", "Стерильній", "Реєстраційній", "Брудній", "Чистій"], "a": "Чистій"}, {"q": "Укажіть необхідне оснащення точки догляду за пацієнтом.", "o": ["Кран із ліктьовим механізмом", "Диспенсер із паперовими одноразовими рушниками", "Диспенсер із рідким милом", "Диспенсер з антисептиком", "Умивальник"], "a": "Диспенсер з антисептиком"}, {"q": "Старша сестра медична інструктує своїх підлеглих щодо правил гігієни рук. Який тип нагадування на робочому місці є найефективнішим для активізації уваги?", "o": ["Аудіоповідомлення", "Накази", "Інформаційні плакати", "Санбюлетні", "Конференції"], "a": "Інформаційні плакати"}, {"q": "Упродовж якого терміну часу потрібно провести первинне обстеження на ВІЛ медичного працівника, у якого відбувся контакт із джерелом потенційного інфікування ВІЛ, пов’язаний із виконанням професійних обов’язків?", "o": ["1-го місяця", "3-х днів", "14-ти днів", "3-х місяців", "2-х місяців"], "a": "3-х днів"}, {"q": "Бригада екстреної (швидкої) медичної допомоги транспортує пацієнта з підтвердженим діагнозом: туберкульоз — до спеціалізованого закладу охорони здоров’я. Який бар’єрний засіб захисту від можливого інфікування необхідно застосувати членам бригади?", "o": ["Хірургічну маска", "Хірургічні рукавички", "Респіратор", "Захисний екран", "Халат"], "a": "Респіратор"}, {"q": "Сестра медична проводить заміну та сортування постільної білизни тяжкохворого пацієнта. Класифікуйте ступінь забруднення текстильних виробів, якщо вони значно забруднені кров’ю та іншими біологічними виділеннями пацієнта?", "o": ["III", "II", "IV", "-", "І"], "a": "IV"}, {"q": "Операційна сестра медична комплектує стерилізаційний бікс та укладає все необхідне (операційну білизну, халати, перев’язувальний матеріал та ін.) для роботи перев’язувального кабінету або малої операційної впродовж одного робочого дня. Як називається такий вид укладки?", "o": ["Універсальна", "Спеціалізована", "Цілеспрямована", "-", "Видова"], "a": "Універсальна"}, {"q": "Маніпуляційна сестра медична контролює термін стерильності матеріалу в біксі, який не був розкритий. Впродовж якого часу зберігається його стерильність?", "o": ["1-го тижня", "8-ми год", "6-ти днів", "1-го дня", "3-х діб"], "a": "3-х діб"}, {"q": "Під час догляду за пацієнтом, який хворіє на інфекційне захворювання, медичний працівник поєднує декілька засобів індивідуального захисту. Який предмет індивідуального захисту потрібно одягати останнім?", "o": ["Хірургічний костюм", "Респіратор", "Захисні окуляри", "Маску", "Рукавички"], "a": "Рукавички"}, {"q": "Після забору крові з вени для лабораторного дослідження сестра медична сортує використані одноразові вироби медичного призначення за категоріями медичних відходів. До якої категорії медичних відходів належать засоби індивідуального захисту (ЗІЗ)?", "o": ["А", "Е", "С", "В", "D"], "a": "В"}, {"q": "Упродовж скількох діб допускається заповнення контейнерів для небезпечно гострих медичних відходів категорії В?", "o": ["14-ти", "6-ти", "5-ти", "10-ти", "3-х"], "a": "3-х"}, {"q": "Яку процедуру потрібно провести медичному працівнику після контакту з потенційно інфікованим матеріалом та зняття медичних рукавичок?", "o": ["Одягання нових рукавичок", "Висушування рук", "Хірургічну обробку рук", "Миття рук із милом", "Гігієнічну обробку рук"], "a": "Гігієнічну обробку рук"}, {"q": "Старша сестра медична хірургічного відділення пояснює своїм підлеглим правила асе ічною серцевою недостатністю сестра медична звернула увагу на збільшення маси тіла пацієнта та зменшення виділення кількості сечі. Аналіз водного балансу встановив, що добовий діурез пацієнта становить 50% від кількості прийнятої рідини. Зробіть висновок за результатами обстеження.", "o": ["-", "Порушення метаболізму", "Зневоднення", "Поява прихованих набряків", "Ожиріння"], "a": "Поява прихованих набряків"}, {"q": "Вкажіть типовий симптом, характерний для хронічної серцевої недостатності.", "o": ["Пітливість", "Підвищення температури тіла", "Крововиливи на шкірі", "Набряки на обличчі", "Набряки на нижніх кінцівках"], "a": "Набряки на нижніх кінцівках"}, {"q": "Пацієнтка, яка хворіє на хронічну серцеву недостатність, скаржиться на наростаючу задишку під час звичайних фізичних навантажень, часте серцебиття, підвищену втомлюваність та знижену працездатність. Добовий діурез становить 400 мл. На якій частині тіла насамперед виникатимуть набряки у пацієнтки?", "o": ["Поперековій ділянці", "Нижніх кінцівках", "Кистях рук", "Обличчі", "Животі"], "a": "Нижніх кінцівках"}, {"q": "У пацієнта, який хворіє на пневмонію, на тлі швидкого (упродовж декількох годин) зниження температури тіла із 39,5°С до 37,0°С, раптово виникли загальна слабкість, запаморочення, відчуття холоду, серцебиття. Об’єктивно спостерігається: пацієнт млявий, апатичний, із зусиллям відповідає на запитання. Шкірні покриви та слизові бліді, холодний липкий піт, кінцівки холодні, дихання поверхневе, пульс — 98 уд./хв, слабкого наповнення, AT 80/50 мм рот. ст. Який патологічний стан розвинувся в пацієнта?", "o": ["Колапс", "Астматичний статус", "Кардіогенний шок", "Анафілактичний шок", "Набряк легень"], "a": "Колапс"}, {"q": "У пацієнта, який хворіє на пневмонію, на тлі швидкого (упродовж декількох годин) зниження температури тіла із 39,5°С до 37°С, раптово виникли загальна слабкість, запаморочення, відчуття холоду, серцебиття. Об’єктивно спостерігається: пацієнт млявий, апатичний, із зусиллям відповідає на запитання. Шкірні покриви та слизові оболонки бліді, холодний липкий піт, кінцівки холодні, дихання поверхневе, пульс — 98/хв, слабкого наповнення, AT— 80/50 мм рт. ст. Який патологічний стан розвинувся в пацієнта?", "o": ["Кардіогенний шок", "Анафілактичний шок", "Колапс", "Набряк легень", "Астматичний статус"], "a": "Колапс"}, {"q": "У пацієнтки температура тіла швидко, протягом декількох годин, знизилася з 39,5°С до 37°С (критичний варіант зниження температури) та розвинулися загальна слабкість, запаморочення, шум у вухах, прискорене серцебиття. Об’єктивно спостерігається: шкірні покриви та слизові бліді, холодний липкий піт, кінцівки холодні, дихання поверхневе, часте, пульс — 98/хв, слабкого наповнення, АТ — 80/50 мм рт. ст. Який препарат використовується для надання невідкладної допомоги у цьому разі?", "o": ["1%-й розчин мезатону", "1%-й розчин супрастину", "2%-й розчин дротаверину", "0,2%-й розчин платифіліну", "2%-й розчин папаверину"], "a": "1%-й розчин мезатону"}, {"q": "Укажіть групу лікарських засобів, що використовується у лікуванні пацієнтів, які хворіють на атеросклероз, з метою зниження рівня холестерину в крові та нормалізації ліпідного профілю.", "o": ["Ꞵ -адреноблокатори", "Статини", "Антикоагулянти", "Антиагреганти", "Інгібітори АПФ"], "a": "Статини"}]}, {"s": "ВНУТРІШНЯ МЕДИЦИНА", "t": "Захворювання органів шлунково-кишкового тракту", "q": [{"q": "До гастроентеролога звернулася пацієнтка віком 65 років, яка довгий час хворіє на виразкову хворобу шлунка. Пацієнтка скаржиться на відчуття розпирання і тяжкості в ділянці шлунка, відрижку, що виникає після вживання м’ясної їжі, загальну слабкість і швидку втомлюваність, значне зниження маси тіла (за два місяці — на 10 кг). У периферичній крові виявлено ознаки анемії. Для якого захворювання характерні вказані клінічні прояви?", "o": ["Гострого гастроентероколіту", "Раку нирки", "Раку шлунка", "Гострого панкреатиту", "Хронічного холециститу"], "a": "Раку шлунка"}, {"q": "У пацієнта, який хворіє на виразк міну гостроти зору, двоїння в очах, погіршення сну, пітливість, дратівливість, зменшення маси тіла за збереженого апетиту. Об’єктивно спостерігається: тремор рук і тіла, пульс — 110 уд./хв, екзофтальм, збільшення розмірів щитоподібної залози. Попередній діагноз: дифузний токсичний зоб. Який із нижченаведених факторів посідає перше місце серед можливих причин розвитку цього захворювання?", "o": ["Шкідливі звички", "Порушення дієти", "Переохолодження", "Куріння", "Психотравма"], "a": "Психотравма"}, {"q": "Для якого ендокринного захворювання характерна поява у пацієнта таких очних симптомів: екзофтальм, рідке моргання (симптом Штельвага), відставання верхньої повіки від райдужки під час переведення погляду вгору (симптом Грефе), блиск очей (симптом Крауса)?", "o": ["Нецукрового діабету", "Гіпотиреозу", "Аутоімунного тиреоїдиту", "Дифузного токсичного зоба", "Цукрового діабету"], "a": "Дифузного токсичного зоба"}, {"q": "У пацієнта, який хворіє на дифузний токсичний зоб, спостерігається симптом «телеграфного стовпа». Укажіть клінічні прояви цього симптому.", "o": ["Ністагм", "Атактична хода", "Девіація язика", "Переміжна кульгавість", "Тремор всього тіла"], "a": "Тремор всього тіла"}, {"q": "Пацієнт ендокринологічного відділення скаржиться на прискорене серцебиття, біль у ділянці серця, погіршення сну, схуднення на тлі підвищення апетиту. Об’єктивно спостерігається: пацієнт збуджений, тремор пальців рук, шкіра волога, тепла, температура тіла - 372°С, пульс - 100/хв, AT - 150/90 мм рт. ст., екзофтальм, позитивний симптом Грефе, збільшення щитоподібної залози, тони серця звучні, систолічний шум на верхівці. Яке дослідження треба провести для визначення функції щитоподібної залози?", "o": ["Загальний аналіз крові", "Аналіз крові на тиреоїдні гормони", "Аналіз крові на глюкозу", "УЗД щитоподібної залози", "МРТ головного мозку"], "a": "Аналіз крові на тиреоїдні гормони"}, {"q": "У пацієнта віком 45 років під час огляду та об’єктивного обстеження виявлено збільшення розмірів щитоподібної залози. Укажіть основний метод дослідження, що проводиться для визначення її функції.", "o": ["Аналіз крові на тиреоїдні гормони", "Загальноклінічний аналіз сечі", "Загальноклінічний аналіз крові", "УЗД щитоподібної залози", "Аналіз крові на глюкозу"], "a": "Аналіз крові на тиреоїдні гормони"}, {"q": "У пацієнтки з діагнозом: дифузний токсичний зоб, після тяжкого емоційного перенавантаження раптово підвищилася температура тіла до 40°С, зявилося рясне потовиділення, нудота, блювання, профузна діарея. Обєктивно спостерігається: пацієнтка збуджена, свідомість порушена, слизові оболонки сухі, АТ – 220/105 мм рт. ст., пульс – 180/хв. Яке ускладнення розвинулося в пацієнтки?", "o": ["Гіпертензивний криз", "Гіперглікемічна кома", "Набряк мозку", "Гіпоглікемічна кома", "Тиреотоксичний криз"], "a": "Тиреотоксичний криз"}, {"q": "У пацієнтки з ожирінням під час обстеження в ділянці живота та стегон виявлено надлишкове, рівномірне розподілення жирової тканини. Який це вид ожиріння?", "o": ["Гіпотиреоїдне", "Аліментарно-конституційне", "Диспластичне", "-", "Церебральне"], "a": "Аліментарно-конституційне"}, {"q": "Ускладненням якого захворювання є кретинізм?", "o": ["Хвороби Аддісона", "Цукрового діабету", "Вродженого гіпотиреозу", "Хвороби Іценко-Кушинга", "Нецукрового діабету"], "a": "Вродженого гіпотиреозу"}, {"q": "Пацієнтка після струмектомії скаржиться на млявість, загальну слабкість, зниження працездатності та пам’яті, мерзлякуватість, підвищену сонливість. Об’єктивно спостерігається: шкіра суха, лущиться, не береться в складку, волосся сухе, ламке, випадає. Пульс – 54/хв, ритмічний, АТ – 100/60 мм рт. ст. Для якого захворювання характерні ці симптоми?", "o": ["Гіпертиреозу", "Атеросклерозу", "Гіпотиреозу", "Акромегалії", "Цукрового діабету"], "a": "Гіпотиреозу"}]}, {"s": "ВНУТРІШНЯ МЕДИЦИНА", "t": "Гематологія", "q": [{"q": "Жінці віком 35 років діагностувано залізодефіцитну анемію. Які продукти харчування мають бути у достатній кількості в раціоні харчуван иту"], "a": "Малярії"}, {"q": "Для профілактики якого специфічного ускладнення черевного тифу на 3-му тижні хвороби пацієнту треба дотримуватися ліжкового режиму?", "o": ["Кишкової кровотечі", "Печінкової недостатності", "Генералізації інфекції", "Розриву селезінки", "Рецидиву захворювання"], "a": "Кишкової кровотечі"}, {"q": "Пацієнт скаржиться на тупий біль у правому підребер’ї, слабкість, зниження апетиту, біль у суглобах упродовж двох тижнів. З анамнезу відомо що чоловік вживає ін’єкційні наркотики. Під час об’єктивного обстеження виявлено: жовтяниця шкіри і склер, збільшення печінки та селезінки, сеча темного кольору, випорожнення знебарвлені. Для якого захворювання характерні ці клінічні показники?", "o": ["Висипного тифу", "ВІЛ-інфекції", "Лептоспірозу", "Кишкового ієрсиніозу", "Вірусного гепатиту С"], "a": "Вірусного гепатиту С"}, {"q": "У пацієнта інфекційного стаціонару спостерігається тяжкий загальний стан, акроціаноз, сухість шкіри, загострення рис обличчя, блювання «фонтаном», діарея більше 15 разів на добу, періодичні судоми. Випорожнення водянисті, каламутні, з білими пластівцями. Який механізм розвитку діареї у пацієнта?", "o": ["Запальний", "Осмотичний", "Інвазивний", "Секреторний", "Ексудативний"], "a": "Секреторний"}, {"q": "Який шлях передачі інфекції в закладах охорони здоров’я відноситься до артифіційних?", "o": ["Вертикальний", "Контактно-побутовий", "Фекально-оральний", "Асоційований із медичними процедурами", "Повітряно-краплинний"], "a": "Асоційований із медичними процедурами"}, {"q": "Чоловік віком 37 років скаржиться на нудоту, блювання, сухість у роті, відчуття «туману» перед очима, утруднення під час ковтання. Вказані симптоми з’явилися черездобу після вживання в’яленої риби. Для якого захворювання характерні ці клінічні прояви?", "o": ["Поліомієліту", "Шигельозу", "Сальмонельозу", "Харчової токсикоінфекції", "Ботулізму"], "a": "Ботулізму"}, {"q": "Упродовж якого терміну часу потрібно провести обстеження на ВІЛ медичного працівника, у якого відбувся контакт із джерелом потенційного інфікування ВІЛ, пов’язаний із виконанням професійних обов’язків?", "o": ["1-го місяця", "5-ти днів", "14-ти днів", "3-х місяців", "2-х місяців"], "a": "5-ти днів"}, {"q": "Пацієнта віком 35 років шпиталізовано до лікарні на 5-ту добу захворювання зі скаргами на сильний біль у м’язах, підвищення температури тіла до 39°С, головний біль, пожовтіння шкіри. Об’єктивно спостерігається: язик сухий, обкладений білим нальотом, пульс — 120/хв, AT — 80/50 мм рт. ст., тони серця приглушені, печінка виступає з-під краю реберної дуги на 3,5 см. Результати загального аналізу крові: лейкоцитоз, підвищення ШОЕ. Спостерігається зменшення добового об’єму сечі. З анамнезу з’ясувалося, що 2 тижні тому купався в озері. Для якого захворювання характерні вказані клініко-лабораторні показники?", "o": ["Гепатиту", "ВІЛ-інфекції", "Лептоспірозу", "Малярії", "Бешихи"], "a": "Лептоспірозу"}, {"q": "Чоловіка вкусив пес, який, імовірно, був хворий на сказ. Який із нижченаведених симптомів може спостерігатися у пацієнта вже в продромальному періоді захворювання?", "o": ["Паралічі", "Гіперестезії", "Аерофобія", "Гіперсалівація", "Фотофобія"], "a": "Гіперсалівація"}, {"q": "Під час догляду за пацієнтом, який хворіє на інфекційне захворювання, медичний працівник поєднує декілька засобів індивідуального захисту. Який предмет індивідуального захисту потрібно одягати останнім?", "o": ["Хірургічний костюм", "Респіратор", "Захисні окуляри", "Маску", "Рукавички"], "a": "Рукавички"}]}, {"s": "Дисципліни терапевтичного профілю", "t": "Дерматологія", "q": [{"q": "У чоловіка віком 28 років у ділянці верхньої губи спостерігаються гіперемія шкіри та поява дрібних пухирців із гнійним умістом, покритих жовтими кірками, піднижньощелепний лімфаденіт. Для якої патології характерні ці симптоми?", "o": ["Імпетиго", "Сикозу", "Мікроспорії", "Кандидозу", "Фурункулу"], "a": "Сикозу"}, {"q": "У дівчини віком 19 років на шкірі грудної клітки, шиї. бічних поверхонь тулуба, міжл ив ароматизаторів у повітрі робочої зони", "Контакт із паперовими матеріалами", "Вплив холоду та низьких температур"], "a": "Контакт із фарбами та лаками"}, {"q": "До лікаря-дерматолога звернулася пацієнтка зі скаргами на появу висипань на кистях рук. Після обстеження їй встановлено діагноз: справжня екзема в стадії мокнуття. Яка лікарська форма (форма випуску) препаратів рекомендована для місцевого лікування цього захворювання?", "o": ["Мазь", "Гель", "Паста", "Розчин", "Крем"], "a": "Розчин"}, {"q": "У пацієнта раптово підвищилася температура тіла, з’явилася болючість шкіри. З анамнезу відомо, що він приймає антибіотики. Під час об’єктивного обстеження на шкірі тулуба виявлено множинні бульозні елементи та яскраво-червоні ерозії. Також спостерігається позитивний симптом Нікольського. Для якого захворювання характерні вказані клінічні прояви?", "o": ["Токсичного епідермального некролізу", "Герпетиформного дерматиту Дюрінга", "Алергійного контактного дерматиту", "Фіксованої медикаментозної еритеми", "Простого контактного дерматиту"], "a": "Токсичного епідермального некролізу"}, {"q": "Пацієнту віком 30 років встановлено діагноз: псоріаз. Який специфічний клінічний прояв вказуватиме на стадію (фазу) захворювання?", "o": ["Симптом Нікольського", "Плями Бельського-Філатова-Копліка", "Висип у вигляді «метелика»", "Кільцеподібна еритема", "Симптом Кебнера"], "a": "Симптом Кебнера"}]}, {"s": "Дисципліни терапевтичного профілю", "t": "Медична та соціальна реабілітація", "q": [{"q": "Які процедури треба порадити пацієнту після зняття гіпсової пов’язки для відновлення функції травмованої нижньої кінцівки?", "o": ["ЛФК, масаж", "Гірудотерапію", "Зігрівальний компрес", "Фототерапію", "УФО"], "a": "ЛФК, масаж"}, {"q": "Вкажіть тривалість прийому родонової ванни.", "o": ["30-40 хв", "50-60 хв", "1-2 хв", "5-7 хв", "10-15 хв"], "a": "10-15 хв"}, {"q": "Пацієнту з діагнозом: гіпертонічна хвороба І ст., призначено електрофорез із 5% розчином сульфату магнію. Яка методика проведення  "25 %"], "a": "37%"}, {"q": "Опіки якого ступеня характеризуються появою пухирів різної величини, наповнених прозорою рідиною, на тлі гіперемованої шкіри", "o": ["II", "IIІ", "IV", "І", "-"], "a": "II"}, {"q": "Після роботи з електроприладами чоловік помітив на долоні правої руки біло-сіру пляму діаметром 4 мм. Який вид електротравми виник у чоловіка?", "o": ["Опік", "Знак", "-", "Металізація", "Електроофтальмія"], "a": "Опік"}, {"q": "У чоловіка після роботи з електроприладом на долоні правої руки візуалізується ділянка некрозу шкіри — біло-сіра пляма діаметром 4 мм. Який вид місцевої електротравми спостерігається в чоловіка?", "o": ["Електричний знак", "Електричний опік", "Металізація шкіри", "Механічне ушкодження", "Електроофтальмія"], "a": "Електричний знак"}]}, {"s": "ХІРУРГІЯ", "t": "Х. Хірургічна інфекція", "q": [{"q": "Чоловік скаржиться на підвищення температури тіла, головний біль та різкий розпираючий біль у ділянці задньої поверхні шиї. Під час огляду виявлено щільний інфільтрат темночервоного кольору, діаметром 7-8 см, різко болючий під час пальпації, покритий дрібними множинними отворами, з яких виділяється гнійна рідина. Для якого захворювання характерні ці симптоми?", "o": ["Карбункулу", "Фурункулу", "Контагіозного молюска", "Бешихи", "Дерматофітії"], "a": "Карбункулу"}, {"q": "Чим треба насамперед промити рану після укусу собаки до приїзду бригади екстреної (швидкої) медичної допомоги?", "o": ["Мильним розчином", "Розчином бетадину", "10% розчином натрію хлориду", "Розчином фурациліну", "-"], "a": "Мильним розчином"}, {"q": "Вкажіть постін’єкційне ускладнення, що характеризується гнійним запаленням м’яких тканин та утворенням порожнини, заповненої гноєм.", "o": ["Абсцес", "Флебіт", "Емболія", "Інфільтрат", "Некроз"], "a": "Абсцес"}, {"q": "Пацієнт віком 18 років скаржиться на підвищення температури тіла до 38,2°С, набряк і почервоніння правої щоки. Об’єктивно спостерігається: у ділянці правої щоки визначається інфільтрат, болючий під час пальпації, шкіра над ним напружена, гіперемована, у центрі інфільтрату візуалізується стрижень у вигляді сіро-зелених мас. Який запальний процес розвинувся в пацієнта?", "o": ["Фурункул", "Карбункул", "Абсцес", "Гідраденіт", "Флегмона"], "a": "Фурункул"}, {"q": "У жінки віком 48 років після відвідування салону краси з'явилися біль, припухлість та почервоніння в ділянці вказівного пальця лівої руки. Під час об'єктивного обстеження виявлено набряк фаланги та болюче при пальпації утворення із серозно-гнійним вмістом навколо нігтьової пластини. Для якого захворювання найхаракерніші ці клінічні прояви?", "o": ["Панарицію", "Флегмони кисті", "Гідраденіту", "Оніхомікозу", "Контактного дерматиту"], "a": "Панарицію"}, {"q": "У пацієнтки віком 68 років, якій із метою тривалої інфузійної терапії встановлено периферичний венозний катетер, спостерігається набряк, почервоніння та ущільнення вздовж катетеризованої вени. Також пацієнтка скаржиться на біль під час згинання руки в ліктьовому суглобі, де встановлено катетер. Для якого постін’єкційного ускладнення характерні ці клінічні прояви?", "o": ["Флебіту", "Абсцесу", "Медикаментозної емболії", "Повітряної емболії", "Алергічної реакції"], "a": "Флебіту"}]}, {"s": "ХІРУРГІЯ", "t": "ХІ. Пухлини. Некрози", "q": [{"q": "Пацієнту проведено прицільну біопсію з метою діагностики онкологічного захворювання. Яке лабораторне дослідження біоптату треба використати для виявлення злоякісних клітин чи інших змін, що можуть вказувати на наявність пухлинного процесу?", "o": ["Цитологічне", "Серологічне", "Бактеріологічне", "Біохімічне", "Загальноклінічне"], "a": "Цитологічне"}, {"q": "Сестра медична онкологічного відділення за призначенням лікаря проводить пацієнту тривале внутрішньовенне введення хіміотерапевтичних засобів. Яка електронна система моніторингу та дозованого введення великих об’ємів рідини використовується в цьому разі?", "o": ["Інфузомат", "Аутоін’єктор", "Аплікатор", "Медикатор", "Небулайзер"], "a": "Інфузомат"}]}, {"s": "ХІРУРГІЯ", "t": const DASH = /^[\s\-–—−]+$/;
const app = document.getElementById("app");
const cfg = {limit: 0, shuffleQ: false, shuffleO: false, reveal: false};
let S = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const LET = "ABCDE";
// keep only questions with a known correct answer; hide "—" placeholder options; remember the original letters
function prepare(items) {
  return items.filter(x => x.a && x.o.indexOf(x.a) >= 0).map(x => ({
    q: x.q, a: x.a,
    o: x.o.map((t, i) => ({t: t, L: LET[i]})).filter(p => p.t === x.a || !DASH.test(p.t))
  }));
}
const TOPICS = DATA.map(t => ({s: t.s || "", t: t.t, items: prepare(t.q), all: t.q.length}));

function check(parent, text, key) {
  const l = el("label", "");
  const c = el("input"); c.type = "checkbox"; c.checked = cfg[key];
  c.onchange = () => { cfg[key] = c.checked; };
  l.append(c, document.createTextNode(" " + text));
  parent.append(l);
}

function home() {
  S = null;
  document.title = TITLE;
  app.replaceChildren();
  app.append(el("h1", "", TITLE));
  const total = TOPICS.reduce((n, t) => n + t.items.length, 0);
  app.append(el("div", "muted", "Обери тему. Після кожної відповіді одразу видно, правильно чи ні. Усього питань: " + total));

  const opts = el("div", "card");
  const row1 = el("div", "row");
  const lab = el("label", "", "Скільки питань: ");
  const sel = el("select");
  [["0", "усі"], ["10", "10"], ["20", "20"], ["50", "50"]].forEach(([v, t]) => {
    const o = el("option", "", t); o.value = v; if (+v === cfg.limit) o.selected = true; sel.append(o);
  });
  sel.onchange = () => { cfg.limit = +sel.value; };
  lab.append(sel);
  row1.append(lab);
  const col = el("div", "col");
  check(col, "перемішувати питання", "shuffleQ");
  check(col, "перемішувати варіанти відповідей", "shuffleO");
  check(col, "режим перегляду: правильна відповідь видна одразу", "reveal");
  opts.append(row1, col);
  app.append(opts);

  const allBtn = el("button", "topic");
  allBtn.append(el("span", "", "Усі теми разом"), el("span", "n", total + " пит."));
  allBtn.disabled = total === 0;
  allBtn.onclick = () => start([].concat(...TOPICS.map(t => t.items)));
  app.append(allBtn);
  let curSubj = null;
  TOPICS.forEach(t => {
    if (t.s !== curSubj) {
      curSubj = t.s;
      const mine = TOPICS.filter(x => x.s === curSubj);
      if (curSubj && !(mine.length === 1 && mine[0].t === curSubj)) {
        const n = mine.reduce((k, x) => k + x.items.length, 0);
        app.append(el("h2", "subj", curSubj));
        const sb = el("button", "topic all");
        sb.append(el("span", "", "Весь предмет"), el("span", "n", n + " пит."));
        sb.disabled = n === 0;
        sb.onclick = () => start([].concat(...mine.map(x => x.items)));
        app.append(sb);
      }
    }
    const b = el("button", "topic");
    b.append(el("span", "", t.t), el("span", "n", t.items.length + " пит."));
    b.disabled = t.items.length === 0;
    b.onclick = () => start(t.items);
    app.append(b);
  });
}

function start(items, noReveal) {
  let list = cfg.shuffleQ ? shuffle(items) : items.slice();
  if (cfg.limit > 0) list = list.slice(0, cfg.limit);
  S = {list: list, i: 0, ok: 0, bad: [], answered: false, opts: [], view: "quiz", reveal: cfg.reveal && !noReveal};
  quiz();
}

function quiz() {
  const it = S.list[S.i], N = S.list.length;
  S.answered = false;
  S.tries = 0;
  S.opts = cfg.shuffleO ? shuffle(it.o) : it.o.slice();
  app.replaceChildren();
  const back = el("button", "back", "← до списку тем");
  back.onclick = home;
  app.append(back);
  const bar = el("div", "bar");
  bar.append(el("span", "", "Питання " + (S.i + 1) + " з " + N));
  if (S.reveal) {
    const jl = el("label", "", "перейти до № ");
    const j = el("input", "jump"); j.type = "number"; j.min = 1; j.max = N; j.value = S.i + 1;
    j.onchange = () => { const v = Math.min(Math.max(parseInt(j.value, 10) || 1, 1), N); S.i = v - 1; quiz(); };
    jl.append(j);
    bar.append(jl);
  } else {
    bar.append(el("span", "", "✔ " + S.ok + "   ✘ " + S.bad.length));
  }
  app.append(bar);
  const track = el("div", "track"), fill = el("div", "fill");
  fill.style.width = (S.i / N * 100) + "%";
  track.append(fill);
  app.append(track);

  const card = el("div", "card");
  card.append(el("h2", "", it.q));
  const btns = S.opts.map((p, idx) => {
    const b = el("button", "opt");
    b.append(el("span", "k", (cfg.shuffleO ? String(idx + 1) : p.L) + "."), el("span", "", p.t));
    b.onclick = () => answer(idx);
    card.append(b);
    return b;
  });
  const fb = el("div", "fb");
  fb.setAttribute("aria-live", "polite");
  const nav = el("div", "row");
  const prev = el("button", "btn ghost", "← Назад");
  prev.onclick = prevQ;
  prev.style.display = S.reveal && S.i > 0 ? "" : "none";
  const next = el("button", "btn", S.i + 1 < N ? "Далі" : (S.reveal ? "До списку тем" : "Показати результат"));
  next.style.display = "none";
  next.onclick = nextQ;
  const show = el("button", "btn ghost", "Показати правильну відповідь");
  show.style.display = "none";
  show.onclick = showAnswer;
  nav.append(prev, show, next);
  card.append(fb, nav);
  app.append(card);
  S.ui = {btns, fb, next, show, fill};
  if (S.reveal) {
    S.answered = true;
    btns.forEach((b, k) => {
      b.disabled = true;
      if (S.opts[k].t === it.a) { b.classList.add("ok"); b.firstChild.textContent = "✓"; }
      else b.classList.add("dim");
    });
    fb.className = "fb ok";
    fb.textContent = "Правильна відповідь виділена зеленим.";
    next.style.display = "";
  }
}

function lock(it) {
  S.answered = true;
  S.ui.btns.forEach((b, k) => {
    b.disabled = true;
    if (S.opts[k].t === it.a) { b.classList.add("ok"); b.firstChild.textContent = "✓"; }
    else if (!b.classList.contains("bad")) b.classList.add("dim");
  });
  S.ui.show.style.display = "none";
  S.ui.next.style.display = "";
  S.ui.next.focus();
}
// a wrong choice is marked and the question stays open: pick another option (only the first try counts)
function answer(idx) {
  if (!S || S.view !== "quiz" || S.answered) return;
  const it = S.list[S.i], b = S.ui.btns[idx];
  if (b.disabled) return;
  const chosen = S.opts[idx].t;
  if (chosen === it.a) {
    if (S.tries === 0) S.ok++;
    S.ui.fb.className = "fb ok";
    S.ui.fb.textContent = S.tries === 0 ? "Правильно!" : "Правильно (не з першої спроби).";
    lock(it);
  } else {
    if (S.tries === 0) S.bad.push({it: it, chosen: chosen});
    S.tries++;
    b.disabled = true; b.classList.add("bad"); b.firstChild.textContent = "✗";
    S.ui.fb.className = "fb bad";
    S.ui.fb.textContent = "Неправильно. Спробуй інший варіант.";
    S.ui.show.style.display = "";
  }
}
function showAnswer() {
  if (!S || S.answered) return;
  S.ui.fb.className = "fb";
  S.ui.fb.textContent = "Правильна відповідь виділена зеленим.";
  lock(S.list[S.i]);
}

function nextQ() {
  if (!S || !S.answered) return;
  if (S.reveal) { if (S.i + 1 < S.list.length) { S.i++; quiz(); } else home(); return; }
  S.i++;
  if (S.i < S.list.length) quiz(); else result();
}
function prevQ() {
  if (S && S.reveal && S.i > 0) { S.i--; quiz(); }
}

function result() {
  S.view = "result";
  app.replaceChildren();
  const n = S.list.length, pct = Math.round(S.ok / n * 100);
  const card = el("div", "card");
  card.append(el("div", "muted", "Результат"), el("div", "big", S.ok + " з " + n + " (" + pct + "%)"));
  const row = el("div", "row");
  if (S.bad.length) {
    const r = el("button", "btn", "Повторити помилки (" + S.bad.length + ")");
    r.onclick = () => { const items = S.bad.map(b => b.it); const keep = cfg.limit; cfg.limit = 0; start(items, true); cfg.limit = keep; };
    row.append(r);
  }
  const h = el("button", "btn ghost", "На початок");
  h.onclick = home;
  row.append(h);
  card.append(row);
  app.append(card);
  if (S.bad.length) {
    app.append(el("h3", "", "Помилки"));
    S.bad.forEach(b => {
      const d = el("div", "wrong");
      d.append(el("div", "", b.it.q), el("div", "you", "✗ Ваша відповідь: " + b.chosen), el("div", "right", "✓ Правильно: " + b.it.a));
      app.append(d);
    });
  }
}

document.addEventListener("keydown", e => {
  if (!S || S.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (/^[1-9]$/.test(e.key)) { if (!S.reveal) answer(+e.key - 1); }
  else if (e.key === "ArrowLeft") prevQ();
  else if ((e.key === "Enter" || e.key === "ArrowRight") && S.answered) { e.preventDefault(); nextQ(); }
});
home();
</script>
